<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handy-Cloud 设置界面高保真交互原型 (UI Prototype)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: "#e4699b",
                hover: "#db588c",
                light: "#fce7f0",
                glow: "rgba(228, 105, 155, 0.25)",
              },
              surface: {
                DEFAULT: "#18181b", // zinc-900
                card: "#1f1f23",
                sidebar: "#141416",
                border: "#27272a", // zinc-800
                hover: "#27272a",
              },
            },
          },
        },
      };
    </script>
    <style>
      /* Handy font & subtle scrollbar */
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        user-select: none;
        background-color: #0c0a09;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      .handy-logo {
        font-family:
          "Comic Sans MS", "Bubblegum Sans", "Brush Script MT", cursive,
          sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
    </style>
  </head>
  <body
    class="bg-stone-950 text-stone-100 flex flex-col items-center justify-center min-h-screen p-4 sm:p-8"
  >
    <!-- PROTOTYPE HEADER BANNER -->
    <header
      class="w-full max-w-[1020px] mb-3 flex items-center justify-between px-2 text-xs text-stone-400"
    >
      <div class="flex items-center gap-2">
        <span
          class="px-2 py-0.5 rounded bg-brand/20 text-brand font-mono font-semibold border border-brand/30"
          >PROTOTYPE #9</span
        >
        <span>Handy-Cloud 设置界面与状态管理高保真原型</span>
      </div>
      <div class="flex items-center gap-4 text-stone-400">
        <span
          >当前模式:
          <strong id="header-variant-label" class="text-white font-medium"
            >变体 A</strong
          ></span
        >
        <span
          >快捷键:
          <kbd
            class="px-1.5 py-0.5 rounded bg-stone-800 border border-stone-700 font-mono text-[10px]"
            >←</kbd
          >
          <kbd
            class="px-1.5 py-0.5 rounded bg-stone-800 border border-stone-700 font-mono text-[10px]"
            >→</kbd
          >
          切换变体</span
        >
      </div>
    </header>

    <!-- DESKTOP WINDOW CONTAINER (1:1 Handy Replica) -->
    <main
      id="app-window"
      class="w-full max-w-[1020px] h-[720px] bg-[#18181b] rounded-xl shadow-2xl border border-stone-800/80 flex flex-col overflow-hidden relative"
    >
      <!-- WINDOW TITLE BAR -->
      <div
        class="h-9 bg-[#141416] border-b border-stone-800/60 flex items-center justify-between px-3 shrink-0 select-none"
      >
        <div class="flex items-center gap-2 text-xs text-stone-400 font-medium">
          <span class="text-brand">✌️</span>
          <span>Handy</span>
          <span class="text-stone-600">|</span>
          <span id="titlebar-subtext" class="text-stone-400 text-[11px]"
            >设置 (变体 A — 深度整合型)</span
          >
        </div>
        <!-- Window Controls -->
        <div class="flex items-center gap-2 text-stone-400">
          <button
            class="w-3.5 h-3.5 rounded-full bg-stone-700/60 hover:bg-stone-600 flex items-center justify-center text-[9px]"
          >
            −
          </button>
          <button
            class="w-3.5 h-3.5 rounded-full bg-stone-700/60 hover:bg-stone-600 flex items-center justify-center text-[9px]"
          >
            □
          </button>
          <button
            class="w-3.5 h-3.5 rounded-full bg-red-500/80 hover:bg-red-600 flex items-center justify-center text-[9px] text-white"
          >
            ×
          </button>
        </div>
      </div>

      <!-- MAIN APP BODY -->
      <div class="flex-1 flex overflow-hidden">
        <!-- LEFT SIDEBAR -->
        <aside
          class="w-44 bg-[#141416] border-r border-stone-800/60 flex flex-col p-2.5 shrink-0 justify-between"
        >
          <div class="flex flex-col">
            <!-- Logo -->
            <div class="px-3 py-3 mb-2 flex items-center justify-start gap-2">
              <span
                class="handy-logo text-3xl text-brand tracking-tighter drop-shadow-sm select-none"
                >handy</span
              >
              <span
                class="px-1.5 py-0.5 rounded text-[10px] bg-sky-500/20 text-sky-400 border border-sky-500/30 font-semibold"
                >CLOUD</span
              >
            </div>

            <!-- Dynamic Navigation Items -->
            <nav id="sidebar-nav" class="flex flex-col gap-1 w-full">
              <!-- Injected by JavaScript based on Variant -->
            </nav>
          </div>

          <!-- System & Network Badge on Sidebar Bottom -->
          <div
            class="p-2 rounded-lg bg-stone-900/60 border border-stone-800 text-[11px] text-stone-400 space-y-1"
          >
            <div class="flex items-center justify-between">
              <span class="flex items-center gap-1.5">
                <span
                  id="proxy-status-dot"
                  class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"
                ></span>
                <span id="proxy-status-name">系统代理</span>
              </span>
              <span
                id="proxy-status-port"
                class="font-mono text-[10px] text-stone-500"
                >127.0.0.1:7890</span
              >
            </div>
            <div
              class="text-[10px] text-stone-500 truncate"
              id="proxy-status-mode"
            >
              模式: System (已探测)
            </div>
          </div>
        </aside>

        <!-- MAIN CONTENT VIEWPORT -->
        <div
          id="content-viewport"
          class="flex-1 bg-[#18181b] overflow-y-auto p-6 flex flex-col"
        >
          <!-- Content will be rendered dynamically based on (Active Tab + Active Variant) -->
        </div>
      </div>

      <!-- BOTTOM APP STATUS BAR -->
      <footer
        class="h-8 bg-[#121214] border-t border-stone-800/60 flex items-center justify-between px-4 text-xs text-stone-400 shrink-0"
      >
        <div class="flex items-center gap-2">
          <div
            class="flex items-center gap-1.5 cursor-pointer hover:text-stone-200"
            id="footer-engine-badge"
            onclick="alert('点击可快速在本地与云端转写引擎间切换！')"
          >
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="footer-engine-text" class="font-medium text-stone-300"
              >Qwen3-ASR 0.6B</span
            >
            <i data-lucide="chevron-down" class="w-3 h-3 text-stone-500"></i>
          </div>
          <span class="text-stone-600">•</span>
          <span id="footer-network-text" class="text-stone-500 text-[11px]"
            >全局网络: 跟随系统 (代理生效中)</span
          >
        </div>
        <div class="flex items-center gap-3 text-[11px] text-stone-500">
          <span class="hover:text-stone-300 cursor-pointer">检查更新</span>
          <span>•</span>
          <span>v0.9.6-cloud.1</span>
        </div>
      </footer>
    </main>

    <!-- FLOATING PROTOTYPE SWITCHER (Skill Disciplined) -->
    <aside
      class="fixed bottom-6 bg-stone-900/95 backdrop-blur-md border border-stone-700/80 text-white px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-4 z-50 transition-all"
    >
      <button
        onclick="prevVariant()"
        class="p-1.5 rounded-full hover:bg-stone-800 text-stone-400 hover:text-white transition-colors"
        title="上一个变体 (←)"
      >
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>

      <div class="flex items-center gap-3">
        <div class="flex flex-col items-center">
          <div class="flex items-center gap-2">
            <span
              class="font-bold text-sm tracking-wide text-brand"
              id="switcher-code"
              >变体 A</span
            >
            <span class="text-stone-500 text-xs">/</span>
            <span class="text-xs text-stone-300 font-medium" id="switcher-name"
              >深度整合型 (In-Place)</span
            >
          </div>
          <span
            class="text-[10px] text-stone-400 tracking-tight"
            id="switcher-desc"
            >不增顶层菜单；高级配代理，模型页切云端</span
          >
        </div>

        <!-- Pill Selector -->
        <div
          class="flex items-center bg-stone-950/80 p-1 rounded-full border border-stone-800 gap-1"
        >
          <button
            onclick="setVariant('A')"
            id="pill-A"
            class="px-2.5 py-0.5 rounded-full text-xs font-medium transition-all bg-brand text-white shadow-sm"
          >
            A
          </button>
          <button
            onclick="setVariant('B')"
            id="pill-B"
            class="px-2.5 py-0.5 rounded-full text-xs font-medium transition-all text-stone-400 hover:text-white"
          >
            B
          </button>
          <button
            onclick="setVariant('C')"
            id="pill-C"
            class="px-2.5 py-0.5 rounded-full text-xs font-medium transition-all text-stone-400 hover:text-white"
          >
            C
          </button>
        </div>
      </div>

      <button
        onclick="nextVariant()"
        class="p-1.5 rounded-full hover:bg-stone-800 text-stone-400 hover:text-white transition-colors"
        title="下一个变体 (→)"
      >
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </aside>

    <!-- STATE & APPLICATION SCRIPTS -->
    <script>
      // Global Prototype State
      const state = {
        variant: "A", // 'A' | 'B' | 'C'
        activeTab: "general", // tab ids depend on variant

        // Settings State
        proxy: {
          mode: "system", // 'system' | 'manual' | 'direct'
          server: "127.0.0.1",
          port: "7890",
          protocol: "http", // 'http' | 'socks5'
          auth: false,
          username: "",
          password: "",
          status: "connected", // 'idle' | 'testing' | 'connected' | 'failed'
          latency: 128,
        },
        transcription: {
          mode: "cloud", // 'local' | 'cloud'
          cloudProvider: "gemini", // 'gemini' | 'google_cloud_stt'
          geminiModel: "gemini-2.5-flash",
          geminiApiKey: "AIzaSyA89X-HandyDemoKeySecured99",
          geminiShowKey: false,
          geminiBaseUrl: "",
          customEndpoint: false,
          localModel: "Qwen3-ASR 0.6B",
          failFastErrorPolicy: true,
          testResult: null, // 'testing' | 'success' | 'error'
        },
      };

      const VARIANTS = [
        {
          id: "A",
          name: "深度整合型 (In-Place)",
          code: "变体 A",
          desc: "不增顶层菜单；高级配代理，模型页切云端",
        },
        {
          id: "B",
          name: "独立专属页面型 (Dedicated)",
          code: "变体 B",
          desc: "新增「云端转写」与「网络代理」独立侧边栏",
        },
        {
          id: "C",
          name: "混合矩阵控制台 (Hub & Routing)",
          code: "变体 C",
          desc: "模型页升级为引擎路由中枢；拓扑式状态直显",
        },
      ];

      function setVariant(v) {
        state.variant = v;
        // Default active tab for variant
        if (v === "A") {
          state.activeTab = "models";
        } else if (v === "B") {
          state.activeTab = "cloud_stt";
        } else if (v === "C") {
          state.activeTab = "engine_hub";
        }
        renderAll();
      }

      function nextVariant() {
        const idx = VARIANTS.findIndex((item) => item.id === state.variant);
        const nextIdx = (idx + 1) % VARIANTS.length;
        setVariant(VARIANTS[nextIdx].id);
      }

      function prevVariant() {
        const idx = VARIANTS.findIndex((item) => item.id === state.variant);
        const prevIdx = (idx - 1 + VARIANTS.length) % VARIANTS.length;
        setVariant(VARIANTS[prevIdx].id);
      }

      // Keyboard navigation
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") nextVariant();
        if (e.key === "ArrowLeft") prevVariant();
      });

      // Render Navigation Sidebar based on Variant
      function renderSidebar() {
        const nav = document.getElementById("sidebar-nav");
        let items = [];

        if (state.variant === "A") {
          items = [
            { id: "general", label: "通用", icon: "hand" },
            { id: "history", label: "历史记录", icon: "history" },
            {
              id: "models",
              label: "转录模型",
              icon: "cpu",
              badge: state.transcription.mode === "cloud" ? "云端" : null,
            },
            {
              id: "advanced",
              label: "高级",
              icon: "settings",
              badge: "含代理",
            },
            { id: "about", label: "关于", icon: "info" },
          ];
        } else if (state.variant === "B") {
          items = [
            { id: "general", label: "通用", icon: "hand" },
            { id: "history", label: "历史记录", icon: "history" },
            { id: "cloud_stt", label: "云端转写", icon: "cloud", badge: "PRO" },
            { id: "models", label: "本地模型", icon: "cpu" },
            { id: "network", label: "网络代理", icon: "globe" },
            { id: "advanced", label: "高级", icon: "settings" },
            { id: "about", label: "关于", icon: "info" },
          ];
        } else if (state.variant === "C") {
          items = [
            { id: "general", label: "通用", icon: "hand" },
            { id: "history", label: "历史记录", icon: "history" },
            {
              id: "engine_hub",
              label: "引擎中心",
              icon: "layers",
              badge: "双擎",
            },
            { id: "network_drawer", label: "全局网络", icon: "radio" },
            { id: "advanced", label: "高级", icon: "settings" },
            { id: "about", label: "关于", icon: "info" },
          ];
        }

        nav.innerHTML = items
          .map((item) => {
            const isActive = state.activeTab === item.id;
            return `
          <div onclick="setActiveTab('${item.id}')"
               class="flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer transition-colors ${
                 isActive
                   ? "bg-brand text-white font-medium shadow-sm"
                   : "text-stone-300 hover:bg-stone-800/80 hover:text-white"
               }">
            <div class="flex items-center gap-2.5 truncate">
              <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
              <span class="text-xs truncate">${item.label}</span>
            </div>
            ${item.badge ? `<span class="text-[9px] px-1.5 py-0.2 rounded font-semibold ${isActive ? "bg-white/20 text-white" : "bg-brand/20 text-brand"}">${item.badge}</span>` : ""}
          </div>
        `;
          })
          .join("");

        lucide.createIcons();
      }

      function setActiveTab(tabId) {
        state.activeTab = tabId;
        renderAll();
      }

      // Proxy Simulator Action
      function testProxyConnection() {
        state.proxy.status = "testing";
        renderMainContent();
        setTimeout(() => {
          if (state.proxy.mode === "direct") {
            state.proxy.status = "connected";
            state.proxy.latency = 45;
          } else if (state.proxy.server.trim() && state.proxy.port.trim()) {
            state.proxy.status = "connected";
            state.proxy.latency = Math.floor(Math.random() * 80) + 90;
          } else {
            state.proxy.status = "failed";
          }
          renderAll();
        }, 700);
      }

      // Cloud STT Test Simulator
      function testCloudSTTConnection() {
        state.transcription.testResult = "testing";
        renderMainContent();
        setTimeout(() => {
          if (state.transcription.geminiApiKey.length > 8) {
            state.transcription.testResult = "success";
          } else {
            state.transcription.testResult = "error";
          }
          renderMainContent();
        }, 800);
      }

      function setTranscriptionMode(mode) {
        state.transcription.mode = mode;
        renderAll();
      }

      // Main Content Renderer based on (Variant, ActiveTab)
      function renderMainContent() {
        const container = document.getElementById("content-viewport");

        // Variant A: In-Place
        if (state.variant === "A") {
          if (state.activeTab === "models") {
            container.innerHTML = renderVariantA_ModelsTab();
          } else if (state.activeTab === "advanced") {
            container.innerHTML = renderVariantA_AdvancedTab();
          } else {
            container.innerHTML = renderPlaceholderTab(state.activeTab);
          }
        }
        // Variant B: Dedicated
        else if (state.variant === "B") {
          if (state.activeTab === "cloud_stt") {
            container.innerHTML = renderVariantB_CloudSTTTab();
          } else if (state.activeTab === "network") {
            container.innerHTML = renderVariantB_NetworkTab();
          } else if (state.activeTab === "models") {
            container.innerHTML = renderVariantB_LocalModelsTab();
          } else {
            container.innerHTML = renderPlaceholderTab(state.activeTab);
          }
        }
        // Variant C: Hybrid Studio
        else if (state.variant === "C") {
          if (state.activeTab === "engine_hub") {
            container.innerHTML = renderVariantC_EngineHub();
          } else if (state.activeTab === "network_drawer") {
            container.innerHTML = renderVariantC_NetworkView();
          } else {
            container.innerHTML = renderPlaceholderTab(state.activeTab);
          }
        }

        lucide.createIcons();
      }

      /* -------------------------------------------------------------
       VARIANT A: IN-PLACE (Models with toggle, Advanced with Proxy)
       ------------------------------------------------------------- */
      function renderVariantA_ModelsTab() {
        const isCloud = state.transcription.mode === "cloud";
        return `
        <div class="max-w-3xl w-full mx-auto space-y-5">
          
          <!-- Header with Segmented Engine Toggle -->
          <div class="flex items-center justify-between pb-2 border-b border-stone-800">
            <div>
              <h1 class="text-xl font-bold text-stone-100 flex items-center gap-2">
                <span>转录引擎与模型</span>
                <span class="text-xs px-2 py-0.5 rounded-full ${isCloud ? "bg-sky-500/20 text-sky-400 border border-sky-500/30" : "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"}">
                  当前: ${isCloud ? "云端 API 服务" : "本地离线推理"}
                </span>
              </h1>
              <p class="text-xs text-stone-400 mt-1">选择使用本地硬件算力或高质量云端模型完成语音识别。</p>
            </div>

            <!-- Segmented Pill Switcher -->
            <div class="flex items-center p-1 bg-stone-900 rounded-lg border border-stone-800">
              <button onclick="setTranscriptionMode('local')" 
                class="px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 ${!isCloud ? "bg-brand text-white shadow" : "text-stone-400 hover:text-white"}">
                <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                <span>本地离线模型</span>
              </button>
              <button onclick="setTranscriptionMode('cloud')" 
                class="px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 ${isCloud ? "bg-brand text-white shadow" : "text-stone-400 hover:text-white"}">
                <i data-lucide="cloud" class="w-3.5 h-3.5"></i>
                <span>云端 API (Gemini)</span>
              </button>
            </div>
          </div>

          ${
            isCloud
              ? `
            <!-- CLOUD STT VIEW IN VARIANT A -->
            <div class="space-y-4">
              
              <!-- Provider Selection Card -->
              <div class="bg-[#1f1f23] rounded-lg border border-stone-800 overflow-hidden divide-y divide-stone-800">
                
                <!-- Provider Row -->
                <div class="p-3.5 flex items-center justify-between">
                  <div>
                    <div class="text-xs font-medium text-stone-200 flex items-center gap-1.5">
                      <span>云端服务提供商 (Provider)</span>
                      <i data-lucide="info" class="w-3 h-3 text-stone-500"></i>
                    </div>
                    <div class="text-[11px] text-stone-500 mt-0.5">选择处理音频识别的云端平台</div>
                  </div>
                  <select onchange="state.transcription.cloudProvider = this.value; renderAll();"
                    class="bg-stone-900 border border-stone-700 text-stone-200 text-xs rounded-md px-3 py-1.5 focus:outline-none focus:border-brand">
                    <option value="gemini" ${state.transcription.cloudProvider === "gemini" ? "selected" : ""}>Google Gemini API (首选推荐)</option>
                    <option value="google_cloud_stt" ${state.transcription.cloudProvider === "google_cloud_stt" ? "selected" : ""}>Google Cloud Speech-to-Text V2</option>
                  </select>
                </div>

                <!-- Model Choice Row -->
                <div class="p-3.5 flex items-center justify-between">
                  <div>
                    <div class="text-xs font-medium text-stone-200">指定模型型号 (Model)</div>
                    <div class="text-[11px] text-stone-500 mt-0.5">Gemini 2.5 系列具备毫秒级响应与顶级中英混合准确率</div>
                  </div>
                  <select onchange="state.transcription.geminiModel = this.value; renderAll();"
                    class="bg-stone-900 border border-stone-700 text-stone-200 text-xs rounded-md px-3 py-1.5 focus:outline-none focus:border-brand">
                    <option value="gemini-2.5-flash" selected>gemini-2.5-flash (极速与高准确平衡)</option>
                    <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (轻量低延迟)</option>
                    <option value="gemini-2.5-pro">gemini-2.5-pro (超长上下文深度解析)</option>
                  </select>
                </div>

                <!-- API Key Row -->
                <div class="p-3.5 flex items-center justify-between">
                  <div>
                    <div class="text-xs font-medium text-stone-200 flex items-center gap-1">
                      <span>Gemini API Key</span>
                      <span class="text-red-400">*</span>
                    </div>
                    <div class="text-[11px] text-stone-500 mt-0.5">凭据本地加密存储，仅在发送转写请求时调用</div>
                  </div>
                  <div class="flex items-center gap-2">
                    <div class="relative">
                      <input type="${state.transcription.geminiShowKey ? "text" : "password"}" 
                             value="${state.transcription.geminiApiKey}"
                             oninput="state.transcription.geminiApiKey = this.value"
                             placeholder="AIzaSy..." 
                             class="bg-stone-900 border border-stone-700 rounded-md px-3 py-1.5 pr-8 text-xs text-stone-200 w-64 focus:outline-none focus:border-brand font-mono">
                      <button onclick="state.transcription.geminiShowKey = !state.transcription.geminiShowKey; renderAll();"
                              class="absolute right-2 top-1/2 -translate-y-1/2 text-stone-500 hover:text-stone-300">

              <i data-lucide="arrow-right" class="w-4 h-4 text-stone-600 shrink-0"></i>

                  <div class="text-[10px] text-stone-500 font-mono">STEP 4</div>

              </div>

            </div>
          </div>

          <!-- Dual Engine Master-Detail Split Grid -->
          <div class="grid grid-cols-2 gap-4">
            
            <!-- LEFT COLUMN: LOCAL ENGINES -->
            <div class="p-4 rounded-xl border ${!isCloud ? "border-brand bg-[#1f1f23]" : "border-stone-800 bg-[#1f1f23]/50"} space-y-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <i data-lucide="cpu" class="w-4 h-4 text-brand"></i>
                  <h2 class="text-sm font-bold text-stone-100">本地离线引擎池</h2>
                </div>
                ${!isCloud ? '<span class="px-2 py-0.5 rounded-full text-[10px] bg-brand text-white font-semibold">当前生效</span>' : `<button onclick="setTranscriptionMode('local')" class="text-xs px-2.5 py-1 rounded bg-stone-800 text-stone-300 hover:text-white font-medium">切为此模式</button>`}
              </div>

              <div class="text-xs text-stone-400">无需联网，依靠本机显存/CPU，零隐私外泄风险。</div>

              <div class="space-y-2">
                <div class="p-3 rounded-lg bg-stone-900 border border-stone-800 flex items-center justify-between text-xs">
                  <div>
                    <div class="font-medium text-stone-200">Qwen3-ASR 0.6B</div>

            <!-- RIGHT COLUMN: CLOUD ENGINES -->

                <div class="flex items-center gap-2">

                  <h2 class="text-sm font-bold text-stone-100">云端 API 引擎池</h2>
                </div>
                ${isCloud ? '<span class="px-2 py-0.5 rounded-full text-[10px] bg-sky-500 text-white font-semibold">当前生效</span>' : `<button onclick="setTranscriptionMode('cloud')" class="text-xs px-2.5 py-1 rounded bg-stone-800 text-stone-300 hover:text-white font-medium">切为此模式</button>`}

      function renderPlaceholderTab(tabId) {
        return `
        <div class="max-w-2xl w-full mx-auto py-12 text-center space-y-3">
          <i data-lucide="layers" class="w-12 h-12 text-stone-600 mx-auto"></i>
          <h2 class="text-base font-semibold text-stone-300">页面【${tabId}】</h2>
          <p class="text-xs text-stone-500">此 Tab 保持 Handy 现有行为，请切换至核心改动 Tab（如转录模型、高级、云端转写或网络代理）查看原型。</p>
        </div>
      `;
      }

      // Refresh All UI Elements
      function renderAll() {
        // Update Header & Switcher UI
        const currentVariant = VARIANTS.find((v) => v.id === state.variant);
        document.getElementById("header-variant-label").textContent =
          `${currentVariant.code} (${currentVariant.name})`;
        document.getElementById("titlebar-subtext").textContent =
          `设置 (${currentVariant.code} — ${currentVariant.name})`;
        document.getElementById("switcher-code").textContent =
          currentVariant.code;
        document.getElementById("switcher-name").textContent =
          currentVariant.name;
        document.getElementById("switcher-desc").textContent =
          currentVariant.desc;

        // Update switcher pills
        ["A", "B", "C"].forEach((pid) => {
          const btn = document.getElementById(`pill-${pid}`);
          if (pid === state.variant) {
            btn.className =
              "px-2.5 py-0.5 rounded-full text-xs font-medium transition-all bg-brand text-white shadow-sm";
          } else {
            btn.className =
              "px-2.5 py-0.5 rounded-full text-xs font-medium transition-all text-stone-400 hover:text-white";
          }
        });

        // Update Footer Engine Status
        const isCloud = state.transcription.mode === "cloud";
        const engineText = document.getElementById("footer-engine-text");
        if (engineText) {
          engineText.textContent = isCloud
            ? "☁️ Gemini 2.5 Flash"
            : "● Qwen3-ASR 0.6B";
        }

        // Re-render sidebar and main content
        renderSidebar();
        renderMainContent();
      }

      // Initial boot
      window.addEventListener("DOMContentLoaded", () => {
        setVariant("A");
      });
    </script>
  </body>
